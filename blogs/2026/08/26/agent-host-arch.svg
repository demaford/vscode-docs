<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="architecture-title architecture-desc" role="img" viewBox="0 0 800 280"><title id="architecture-title">VS Code clients, the Agent Host, and agent harnesses</title><desc id="architecture-desc">The VS Code Agents Window and VS Code Editor Window connect to the Agent Host over AHP. The Agent Host contains Copilot and Claude SDK adapters, each of which spawns its agent runtime as a child process.</desc><style>svg{--diagram-bg:#fff;--diagram-surface:#f6f6f7;--diagram-border:#e2e2e3;--diagram-blue-fill:#edf4ff;--diagram-blue-border:#b8d2fb;--diagram-blue:#3b82f6;--diagram-blue-text:#2563eb;--diagram-text:#5f6067;--diagram-muted:#909096;--diagram-muted-text:#686971;font-family:&quot;Segoe UI&quot;,system-ui,-apple-system,sans-serif}.surface{fill:var(--diagram-surface);stroke:var(--diagram-border);stroke-width:2}.section-label{fill:var(--diagram-muted-text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12.5px;letter-spacing:.14em;text-anchor:middle}.card{fill:var(--diagram-bg);stroke:var(--diagram-border);stroke-width:1.5}.client-card,.host-shell{fill:var(--diagram-blue-fill);stroke:var(--diagram-blue-border)}.host-shell{stroke-width:1.8}.connector{fill:none;stroke:var(--diagram-muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.component-label{fill:var(--diagram-text);font-size:14px;font-weight:600}.centered-label,.protocol-label{text-anchor:middle}.protocol-label{fill:var(--diagram-blue-text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13.5px;font-weight:600}.endpoint-icon{fill:none;stroke:var(--diagram-blue);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.endpoint-icon-fill{fill:var(--diagram-blue)}</style><rect width="798" height="278" x="1" y="1" class="surface" rx="14"/><g aria-hidden="true"><path d="M244 128H286M253 120l-9 8 9 8M277 120l9 8-9 8" class="connector"/><path d="M244 202H286M253 194l-9 8 9 8M277 194l9 8-9 8" class="connector"/></g><g><rect width="220" height="64" x="20" y="96" class="card client-card" rx="11"/><rect width="220" height="64" x="20" y="170" class="card client-card" rx="11"/><rect width="220" height="200" x="290" y="54" class="host-shell" rx="13"/><rect width="180" height="64" x="310" y="96" class="card" rx="11"/><rect width="180" height="64" x="310" y="170" class="card" rx="11"/><rect width="220" height="64" x="560" y="96" class="card" rx="11"/><rect width="220" height="64" x="560" y="170" class="card" rx="11"/></g><g aria-hidden="true"><rect width="6" height="22" x="507" y="117" fill="var(--diagram-blue-fill)"/><rect width="6" height="22" x="507" y="191" fill="var(--diagram-blue-fill)"/><path d="M494 128H556M503 120l-9 8 9 8M547 120l9 8-9 8" class="connector"/><path d="M494 202H556M503 194l-9 8 9 8M547 194l9 8-9 8" class="connector"/></g><g><text x="400" y="36" class="section-label">HOST</text><text x="130" y="36" class="section-label">CLIENTS</text><text x="670" y="36" class="section-label">HARNESSES</text><text x="265" y="113" class="protocol-label">AHP</text><text x="265" y="187" class="protocol-label">AHP</text><text x="130" y="134" class="component-label centered-label">VS Code Agents Window</text><text x="130" y="208" class="component-label centered-label">VS Code Editor Window</text><g aria-hidden="true" class="endpoint-icon"><rect width="16" height="5" x="314" y="66" rx="1.25"/><rect width="16" height="5" x="314" y="77" rx="1.25"/><circle cx="326" cy="68.5" r="1.1" class="endpoint-icon-fill"/><circle cx="326" cy="79.5" r="1.1" class="endpoint-icon-fill"/></g><text x="342" y="82" class="component-label">Agent Host process</text><text x="400" y="134" class="component-label centered-label">Copilot SDK</text><text x="400" y="208" class="component-label centered-label">Claude SDK</text><text x="670" y="134" class="component-label centered-label">Copilot runtime process</text><text x="670" y="208" class="component-label centered-label">Claude runtime process</text></g></svg>