<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="wire-title wire-desc" role="img" viewBox="0 0 460 390"><title id="wire-title">A client subscribing to a chat and receiving its ordered event stream</title><desc id="wire-desc">The client lists available sessions, subscribes to a chat channel, receives its current state at sequence 40, then receives five action envelopes with increasing sequence numbers as the chat continues.</desc><style>svg{--diagram-bg:#fff;--diagram-bg-soft:#f6f6f7;--diagram-divider:#e2e2e3;--diagram-text-2:#3c3c43c7;--diagram-text-3:#3c3c438f;--diagram-blue:#3b82f6;--diagram-green:#14a37f;--diagram-orange:#d97706;font-family:&quot;Segoe UI&quot;,system-ui,-apple-system,sans-serif}.wire-bg{fill:var(--diagram-bg-soft);stroke:var(--diagram-divider);stroke-width:1.5}.endpoint-badge{fill:color-mix(in srgb,var(--diagram-blue) 10%,transparent);stroke:color-mix(in srgb,var(--diagram-blue) 30%,transparent)}.endpoint-icon{fill:none;stroke:var(--diagram-blue);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}.endpoint-icon-fill,.endpoint-label{fill:var(--diagram-blue)}.endpoint-label{font-size:12px;font-weight:600}.exchange-arrow{fill:none;stroke:var(--diagram-text-3);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.exchange-method,.stream-label{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;text-anchor:middle}.exchange-method{font-size:11.5px;font-weight:600;fill:var(--diagram-blue)}.exchange-method-response{fill:var(--diagram-green)}.exchange-argument{fill:var(--diagram-text-3);font-weight:400}.stream-divider{stroke:var(--diagram-divider);stroke-width:1}.stream-label{font-size:9.5px;letter-spacing:.1em;fill:var(--diagram-text-3)}.wire-rail{fill:none;stroke:var(--diagram-green);stroke-width:2;stroke-linecap:round;stroke-dasharray:5 7;opacity:.7;animation:wireRailFlow .9s linear infinite;will-change:stroke-dashoffset}.wire-line{transform-box:fill-box}.wire-line-bg{fill:var(--diagram-bg);stroke:var(--diagram-divider)}.seq-bg{fill:var(--diagram-blue)}.evt,.payload .mono,.seq{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.seq{font-size:11px;fill:#fff;text-anchor:middle}.evt{font-size:11.5px}.evt-blue{fill:var(--diagram-blue)}.evt-orange{fill:var(--diagram-orange)}.evt-green{fill:var(--diagram-green)}.payload{font-size:12px;fill:var(--diagram-text-2)}.payload .mono{font-size:11px}.payload .green{fill:var(--diagram-green)}@media (prefers-reduced-motion:reduce){.wire-line,.wire-rail{animation:none!important}.wire-line{opacity:1!important;transform:none!important}}</style><rect width="458.5" height="388.5" x=".75" y=".75" class="wire-bg" rx="12"/><g><rect width="76" height="26" x="16" y="61" class="endpoint-badge" rx="6"/><g aria-hidden="true" class="endpoint-icon"><rect width="13" height="10" x="25" y="67" rx="1.5"/><path d="M28 81h7m-3.5-4v4"/></g><text x="45" y="78" class="endpoint-label">Client</text><rect width="76" height="26" x="368" y="61" class="endpoint-badge" rx="6"/><g aria-hidden="true" class="endpoint-icon"><rect width="12" height="4" x="377" y="67" rx="1"/><rect width="12" height="4" x="377" y="75" rx="1"/><circle cx="386" cy="69" r="1" class="endpoint-icon-fill"/><circle cx="386" cy="77" r="1" class="endpoint-icon-fill"/></g><text x="396" y="78" class="endpoint-label">Host</text></g><g><text x="230" y="20" class="exchange-method">listSessions()</text><path d="M108 29H352m-7-6 7 6-7 6" class="exchange-arrow"/><text x="230" y="54" class="exchange-method exchange-method-response">sessions: […]</text><path d="M352 63H108m7-6-7 6 7 6" class="exchange-arrow"/><text x="230" y="88" class="exchange-method">subscribe<tspan class="exchange-argument">(ahp-chat:/c_8c1)</tspan></text><path d="M108 97H352m-7-6 7 6-7 6" class="exchange-arrow"/><text x="230" y="122" class="exchange-method exchange-method-response">state: { turns: … }<tspan class="exchange-argument"> · fromSeq: 40</tspan></text><path d="M352 131H108m7-6-7 6 7 6" class="exchange-arrow"/></g><line x1="32" x2="174" y1="153" y2="153" class="stream-divider"/><text x="230" y="156" class="stream-label">CHAT CONTINUES</text><line x1="286" x2="428" y1="153" y2="153" class="stream-divider"/><path d="M21 174V373" class="wire-rail"/><g class="wire-line" style="--i:0"><rect width="412" height="35" x="32" y="170" class="wire-line-bg" rx="7"/><rect width="30" height="18" x="44" y="178.5" class="seq-bg" rx="5"/><text x="59" y="191.5" class="seq">41</text><text x="86" y="191.5" class="evt evt-blue">chat/turnStarted</text><text x="250" y="191.5" class="payload">&quot;Add retry logic to the API client&quot;</text></g><g class="wire-line" style="--i:1"><rect width="412" height="35" x="32" y="213" class="wire-line-bg" rx="7"/><rect width="30" height="18" x="44" y="221.5" class="seq-bg" rx="5"/><text x="59" y="234.5" class="seq">42</text><text x="86" y="234.5" class="evt evt-blue">chat/delta</text><text x="250" y="234.5" class="payload">&quot;Sure — I&apos;ll wrap the fetch call…&quot;</text></g><g class="wire-line" style="--i:2"><rect width="412" height="35" x="32" y="256" class="wire-line-bg" rx="7"/><rect width="30" height="18" x="44" y="264.5" class="seq-bg" rx="5"/><text x="59" y="277.5" class="seq">43</text><text x="86" y="277.5" class="evt evt-orange">chat/toolCallStart</text><text x="250" y="277.5" class="payload">Edit file · <tspan class="mono">src/api.ts</tspan></text></g><g class="wire-line" style="--i:3"><rect width="412" height="35" x="32" y="299" class="wire-line-bg" rx="7"/><rect width="30" height="18" x="44" y="307.5" class="seq-bg" rx="5"/><text x="59" y="320.5" class="seq">46</text><text x="86" y="320.5" class="evt evt-orange">chat/toolCallComplete</text><text x="250" y="320.5" class="payload"><tspan class="green">ok</tspan> · 1 file changed</text></g><g class="wire-line" style="--i:4"><rect width="412" height="35" x="32" y="342" class="wire-line-bg" rx="7"/><rect width="30" height="18" x="44" y="350.5" class="seq-bg" rx="5"/><text x="59" y="363.