<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" aria-labelledby="title description" role="img" viewBox="0 0 800 550"><title id="title">Where agent sessions work on code</title><desc id="description">Sessions can work directly on your machine or a connected SSH, Tunnel, or WSL host, or inside a Dev Container on either host. Provider-managed cloud sessions work on a repository and return a pull request. Dev Container sessions require the desktop Agents Window, and available options depend on the host and harness.</desc><rect width="800" height="550" fill="#fff"/><g fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><text x="400" y="51" font-size="28">Where agent sessions work on code</text><text x="400" y="84" fill="#475569" font-size="18">Choose an environment, then an available harness.</text><rect width="242" height="344" x="20" y="118" fill="#eff6ff" stroke="#4a9eed" stroke-width="2" rx="12"/><text x="141" y="153" fill="#1e40af" font-size="22">Your machine</text><text x="141" y="182" fill="#475569" font-size="18">Local workspace</text><rect width="210" height="80" x="36" y="214" fill="#fff" stroke="#4a9eed" stroke-width="2" rx="10"/><text x="141" y="246" font-size="20">Directly on host</text><text x="141" y="273" fill="#475569" font-size="16">Workspace + tools</text><text x="141" y="325" fill="#475569" font-size="18">or</text><rect width="210" height="98" x="36" y="340" fill="#e5dbff" stroke="#8b5cf6" stroke-width="2" rx="10"/><text x="141" y="379" font-size="20">Dev Container*</text><text x="141" y="409" fill="#475569" font-size="16">Workspace + tools</text><rect width="242" height="344" x="279" y="118" fill="#eff6ff" stroke="#4a9eed" stroke-width="2" rx="12"/><text x="400" y="153" fill="#1e40af" font-size="22">Connected host</text><text x="400" y="182" fill="#475569" font-size="18">SSH, Tunnel, or WSL</text><rect width="210" height="80" x="295" y="214" fill="#fff" stroke="#4a9eed" stroke-width="2" rx="10"/><text x="400" y="246" font-size="20">Directly on host</text><text x="400" y="273" fill="#475569" font-size="16">Workspace + tools</text><text x="400" y="325" fill="#475569" font-size="18">or</text><rect width="210" height="98" x="295" y="340" fill="#e5dbff" stroke="#8b5cf6" stroke-width="2" rx="10"/><text x="400" y="379" font-size="20">Dev Container*</text><text x="400" y="409" fill="#475569" font-size="16">Workspace + tools</text><rect width="242" height="344" x="538" y="118" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="12"/><text x="659" y="153" fill="#166534" font-size="22">Provider cloud</text><text x="659" y="182" fill="#475569" font-size="18">Managed infrastructure</text><rect width="210" height="80" x="554" y="214" fill="#fff" stroke="#22c55e" stroke-width="2" rx="10"/><text x="659" y="261" font-size="20">Repository task</text><path fill="none" stroke="#166534" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M659 302 V330 M653 323 L659 330 L665 323"/><rect width="210" height="98" x="554" y="340" fill="#d3f9d8" stroke="#22c55e" stroke-width="2" rx="10"/><text x="659" y="396" font-size="20">Pull request</text><text x="24" y="497" fill="#475569" font-size="16" text-anchor="start">* Dev Container sessions require the desktop Agents Window.</text><text x="24" y="525" fill="#475569" font-size="16" text-anchor="start">Available options depend on the host and harness.</text></g></svg>