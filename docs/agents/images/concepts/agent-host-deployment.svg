<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" aria-labelledby="title description" role="img" viewBox="0 0 800 700"><title id="title">Connect to the host that runs the session</title><desc id="description">The desktop Agents Window on your computer connects to an Agent Host on the same machine or a connected SSH, Tunnel, or WSL host. The Agent Host runs directly on that host or inside its Dev Container and owns the session. The browser-based Agents Window on any device connects through a dev tunnel to an Agent Host on your development machine. Dev Container sessions require the desktop client. These are connection options, not different session types.</desc><rect width="800" height="700" fill="#fff"/><g fill="#1e1e1e" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><text x="400" y="44" font-size="28">Connect to the host that runs the session</text><text x="400" y="76" fill="#475569" font-size="17">The client and host can be on the same machine or different devices.</text><text x="124" y="118" font-size="20">Where you interact</text><text x="578" y="118" font-size="20">Where the session runs</text><rect width="204" height="130" x="22" y="192" fill="#eff6ff" stroke="#4a9eed" stroke-width="2" rx="12"/><text x="124" y="226" fill="#1e40af" font-size="22">Desktop client</text><text x="124" y="256" font-size="20">Agents Window</text><text x="124" y="287" fill="#475569" font-size="17">Your computer</text><text x="300" y="209" fill="#475569" font-size="17">Local, SSH,</text><text x="300" y="231" fill="#475569" font-size="17">Tunnel, or WSL</text><path fill="none" stroke="#1e40af" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M238 259 H366 M359 253 L366 259 L359 265"/><rect width="400" height="280" x="378" y="143" fill="#f8fafc" stroke="#64748b" stroke-width="2" rx="12"/><text x="578" y="177" font-size="22">Workspace host</text><text x="578" y="204" fill="#475569" font-size="16">Same machine or a connected host</text><rect width="156" height="160" x="396" y="239" fill="#eff6ff" stroke="#4a9eed" stroke-width="2" rx="10"/><text x="474" y="267" fill="#1e40af" font-size="19">On the host</text><text x="474" y="311" font-size="20">Agent Host</text><text x="474" y="343" fill="#475569" font-size="17">Session</text><text x="474" y="372" fill="#475569" font-size="16">Workspace tools</text><text x="576" y="326" fill="#475569" font-size="17">or</text><rect width="158" height="160" x="600" y="239" fill="#e5dbff" stroke="#8b5cf6" stroke-width="2" rx="10"/><text x="679" y="267" fill="#5b21b6" font-size="19">Dev Container*</text><text x="679" y="311" font-size="20">Agent Host</text><text x="679" y="343" fill="#475569" font-size="17">Session</text><text x="679" y="372" fill="#475569" font-size="16">Workspace tools</text><rect width="204" height="130" x="22" y="490" fill="#eff6ff" stroke="#4a9eed" stroke-width="2" rx="12"/><text x="124" y="524" fill="#1e40af" font-size="22">Browser client</text><text x="124" y="554" font-size="18">Agents Window web</text><text x="124" y="585" fill="#475569" font-size="17">Any device</text><text x="300" y="531" fill="#475569" font-size="17">Dev tunnel</text><path fill="none" stroke="#1e40af" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M238 552 H366 M359 546 L366 552 L359 558"/><rect width="400" height="174" x="378" y="465" fill="#f8fafc" stroke="#64748b" stroke-width="2" rx="12"/><text x="578" y="498" font-size="22">Development machine</text><rect width="364" height="94" x="396" y="521" fill="#eff6ff" stroke="#4a9eed" stroke-width="2" rx="10"/><text x="578" y="553" font-size="20">Agent Host</text><text x="578" y="584" fill="#475569" font-size="17">Session + workspace tools</text><text x="22" y="675" fill="#475569" font-size="16" text-anchor="start">* Dev Container sessions require the desktop client.</text></g></svg>